<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Inter",system-ui,sans-serif;background:#F5F0E8;color:#111;line-height:1.6;-webkit-font-smoothing:antialiased}
:root{--ivory:#F5F0E8;--ivory-d:#EDE8DF;--black:#111;--gray:#6B6B6B;--gl:#D4CFC7;--white:#fff;--r:12px;--nh:64px;--gap:96px;--mw:1200px}
.con{max-width:var(--mw);margin:0 auto;padding:0 40px}
.pill{display:inline-block;padding:4px 14px;border:1px solid var(--gl);border-radius:100px;font-size:12px;color:var(--gray)}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nh);background:rgba(245,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--gl);display:flex;align-items:center}
.ni{display:flex;align-items:center;width:100%;max-width:var(--mw);margin:0 auto;padding:0 40px}
.nl{font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--black);text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:8px}
.lm{width:30px;height:30px;background:var(--black);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900;flex-shrink:0}
.nlinks{display:flex;gap:28px}
.nlinks a{font-size:14px;color:var(--black);text-decoration:none;opacity:.65;transition:opacity .2s}
.nlinks a:hover,.nlinks a.cur{opacity:1;font-weight:600}
.ncta{margin-left:28px;padding:9px 22px;background:var(--black);color:#fff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.ncta:hover{opacity:.82}
/* page hero */
.phero{padding:calc(var(--nh) + 64px) 0 64px;border-bottom:1px solid var(--gl)}
.phero .kicker{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-family:monospace;margin-bottom:16px}
.phero h1{font-size:clamp(28px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.1;max-width:720px;margin-bottom:18px}
.phero .sub{font-size:17px;color:var(--gray);max-width:520px;line-height:1.72}
/* content */
.sec{padding:var(--gap) 0}
.sl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-family:monospace;margin-bottom:14px}
.sh{font-size:clamp(22px,2.8vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.2;max-width:680px;margin-bottom:16px}
.sp{font-size:15px;color:var(--gray);max-width:520px;line-height:1.72;margin-bottom:44px}
.dv{height:1px;background:var(--gl)}
/* cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--white);border:1px solid var(--gl);border-radius:var(--r);padding:28px 24px}
.card-tag{font-size:11px;font-family:monospace;font-weight:700;text-transform:uppercase;color:var(--gray);margin-bottom:12px;letter-spacing:.05em}
.card-t{font-size:17px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
.card-d{font-size:13px;color:var(--gray);line-height:1.65}
.card-hl{background:var(--ivory-d);border-radius:8px;padding:11px 14px;margin-top:13px;font-size:13px;font-weight:500;line-height:1.5}
/* data table */
.dtbl{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--gl);border-radius:var(--r);overflow:hidden}
.dtbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);padding:12px 20px;background:var(--ivory-d);border-bottom:1px solid var(--gl)}
.dtbl td{padding:14px 20px;font-size:14px;border-bottom:1px solid var(--ivory-d);vertical-align:top}
.dtbl tr:last-child td{border-bottom:none}
.dtbl tr td:first-child{font-weight:600}
/* stat row */
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:40px 0;border-bottom:1px solid var(--gl)}
.stat-v{font-size:36px;font-weight:900;letter-spacing:-.04em;line-height:1}
.stat-l{font-size:12px;color:var(--gray);margin-top:6px;line-height:1.5}
.stat-d{font-size:11px;font-family:monospace;font-weight:600;margin-top:3px}
.up{color:#dc2626}.dn{color:#16a34a}
/* flow */
.flowbox{display:flex;flex-direction:column;gap:0;border:1px solid var(--gl);border-radius:var(--r);overflow:hidden;background:var(--white)}
.frow{display:grid;grid-template-columns:44px 1fr auto;align-items:stretch;border-bottom:1px solid var(--ivory-d)}
.frow:last-child{border-bottom:none}
.fnum{padding:18px 0 18px 18px;font-size:12px;font-weight:800;font-family:monospace;color:var(--gray);display:flex;align-items:center}
.fbody{padding:18px 20px;font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:3px}
.fbody strong{font-weight:600;font-size:14px}
.fbody span{font-size:13px;color:var(--gray)}
.fbadge{padding:18px 20px;display:flex;align-items:center;justify-content:center}
.badge{padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.b-auto{background:#f0faf3;color:#2d7d46}
.b-rev{background:#fffbeb;color:#b45309}
.b-exec{background:#eff6ff;color:#1d4ed8}
/* brief widget */
.brief{background:var(--white);border:1px solid var(--gl);border-radius:var(--r);padding:36px 32px}
.brief-hd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:monospace;color:var(--gray);margin-bottom:24px}
.brief-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:28px;border-bottom:1px solid var(--ivory-d);margin-bottom:24px}
.bm-v{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bm-l{font-size:12px;color:var(--gray);margin-top:5px;line-height:1.4}
.bm-d{font-size:11px;font-family:monospace;font-weight:600;margin-top:3px}
.dec-list{display:flex;flex-direction:column;gap:0}
.dec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--ivory-d);font-size:14px}
.dec:last-child{border-bottom:none}
.dn2{width:22px;height:22px;border-radius:50%;background:var(--black);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
/* cta strip */
.cta-strip{background:#111;color:#fff;padding:72px 0;text-align:center;margin-top:var(--gap)}
.cta-strip h2{font-size:clamp(22px,3vw,36px);font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
.cta-strip p{font-size:15px;color:rgba(255,255,255,.52);margin-bottom:36px}
.bp{padding:13px 26px;background:var(--white);color:#111;border-radius:9px;font-size:14px;font-weight:600;text-decoration:none;display:inline-block}
.bs{padding:13px 26px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:9px;font-size:14px;font-weight:500;text-decoration:none;display:inline-block;margin-left:12px}
.bs:hover{border-color:#fff}
/* footer */
footer{background:#1C1C1C;color:#fff;padding:48px 0 36px}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.flo{font-size:17px;font-weight:800;display:block;margin-bottom:12px}
.ftag{font-size:13px;color:rgba(255,255,255,.4);line-height:1.6;max-width:260px}
.fc h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:14px}
.fc a{display:block;font-size:13px;color:rgba(255,255,255,.55);text-decoration:none;margin-bottom:8px}
.fc a:hover{color:#fff}
.fb{border-top:1px solid rgba(255,255,255,.08);padding-top:24px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.3)}
.fb a{color:rgba(255,255,255,.5);text-decoration:none}
.fb a:hover{color:#fff}
@media(max-width:900px){:root{--gap:64px}.con{padding:0 22px}.nlinks{display:none}.grid2,.grid3,.statrow,.brief-metrics,.fg{grid-template-columns:1fr 1fr}}
@media(max-width:550px){.grid2,.grid3,.statrow,.brief-metrics,.fg{grid-template-columns:1fr}.frow{grid-template-columns:36px 1fr}}
</style>
